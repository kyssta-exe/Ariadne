<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #09090b;
  color: #fafafa;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px;
  position: relative;
  overflow: hidden;
}
/* Subtle gradient accent */
body::before {
  content: '';
  position: absolute;
  top: -200px;
  right: -200px;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
  pointer-events: none;
}
.badge {
  display: inline-block;
  padding: 6px 16px;
  border: 1px solid rgba(250, 250, 250, 0.15);
  border-radius: 20px;
  font-size: 16px;
  color: #a1a1aa;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 24px;
  width: fit-content;
}
h1 {
  font-size: 72px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin-bottom: 16px;
}
.tagline {
  font-size: 28px;
  color: #a1a1aa;
  line-height: 1.4;
  max-width: 800px;
}
.stats {
  display: flex;
  gap: 48px;
  margin-top: 48px;
}
.stat {
  display: flex;
  flex-direction: column;
}
.stat-value {
  font-size: 36px;
  font-weight: 700;
  color: #fafafa;
}
.stat-label {
  font-size: 14px;
  color: #71717a;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 4px;
}
.url {
  position: absolute;
  bottom: 40px;
  left: 80px;
  font-size: 18px;
  color: #52525b;
}
</style>
</head>
<body>
  <div class="badge">Open Source · MIT License</div>
  <h1>Ariadne</h1>
  <div class="tagline">Memory for AI agents.<br>Sub-millisecond search. Zero infrastructure.</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-value">0.89ms</div>
      <div class="stat-label">Vector Search</div>
    </div>
    <div class="stat">
      <div class="stat-value">12×</div>
      <div class="stat-label">Faster than sqlite-vec</div>
    </div>
    <div class="stat">
      <div class="stat-value">90%+</div>
      <div class="stat-label">Recall@10</div>
    </div>
  </div>
  <div class="url">ariadne.mantes.net</div>
</body>
</html>
