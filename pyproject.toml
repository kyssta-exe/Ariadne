[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arriadne"
version = "0.6.2"
description = "AI agent memory system — sub-millisecond hybrid search (FAISS + FTS5 + RRF), knowledge graph, temporal awareness, LLM-powered extraction, entity resolution, conversation memory. Zero infrastructure. OpenAI/Anthropic/Ollama support."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kyssta", email = "kyssta@users.noreply.github.com" },
]
keywords = ["memory", "semantic-search", "vector-search", "knowledge-graph", "ai-agent", "faiss", "fts5", "hybrid-search", "embedding", "deduplication", "retrieval", "rag", "llm", "agent-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "datasketch>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
onnx = [
    "onnxruntime>=1.16.0",
    "huggingface_hub>=0.20.0",
    "tokenizers>=0.15.0",
]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "httpx>=0.25.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
entities = [
    "spacy>=3.7.0",
]
all = [
    "onnxruntime>=1.16.0",
    "huggingface_hub>=0.20.0",
    "tokenizers>=0.15.0",
    "sentence-transformers>=2.2.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "httpx>=0.25.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "spacy>=3.7.0",
]

[project.scripts]
ariadne = "arriadne.cli:main"
ariadne-server = "arriadne.server:main"

[project.urls]
Homepage = "https://github.com/kyssta-exe/Ariadne"
Repository = "https://github.com/kyssta-exe/Ariadne"
Changelog = "https://github.com/kyssta-exe/Ariadne/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/arriadne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100
