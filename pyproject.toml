[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arriadne"
version = "0.13.0"
description = "AI agent memory system — sub-millisecond hybrid search (FAISS vector + FTS5 keyword + RRF fusion), knowledge graph traversal, cognitive retention modeling, and auto-deduplication. Zero infrastructure."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kyssta", email = "kyssta@users.noreply.github.com" },
]
keywords = ["memory", "semantic-search", "vector-search", "knowledge-graph", "ai-agent", "faiss", "fts5", "hybrid-search", "embedding", "deduplication", "retrieval", "rag", "llm", "agent-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "datasketch>=1.5.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]
embeddings = [
    "sentence-transformers>=2.2.0",
]
# Framework adapters (each is optional; importing the module is always safe).
langgraph = [
    "langgraph>=0.2.0",
]
openai-agents = [
    "openai-agents>=0.1.0",
]
integrations = [
    "langgraph>=0.2.0",
    "openai-agents>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
ariadne = "arriadne.cli:main"

[project.urls]
Homepage = "https://github.com/kyssta-exe/Ariadne"
Repository = "https://github.com/kyssta-exe/Ariadne"
Changelog = "https://github.com/kyssta-exe/Ariadne/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/arriadne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The Hermes plugin test requires an external `agent` module from the Hermes
# runtime that isn't part of this repo; exclude it from the default run so the
# suite is green out of the box. It is still exercised in CI that has Hermes.
addopts = "-v --tb=short --ignore=tests/test_plugin.py"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["src/arriadne/dashboard/"]

[[tool.mypy.overrides]]
module = [
    "datasketch.*",
    "numpy.*",
    "faiss.*",
    "faiss",
    "sentence_transformers.*",
    "sentence_transformers",
    "arriadne.embeddings",
    # Optional extras: absent in lint environments by design (import-guarded).
    "tomli",
    "openai.*",
    "anthropic.*",
    "langgraph.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arriadne.storage", "arriadne.interface", "arriadne.dedup"]
# faiss index methods lack stubs; numpy typing is incomplete
disable_error_code = ["union-attr", "arg-type", "no-any-return", "assignment", "var-annotated", "return-value"]

[[tool.mypy.overrides]]
module = [
    "arriadne.memory_manager",
    "arriadne.curator",
    "arriadne.integrations.mcp_server",
]
# dynamic type creation + protocol subscripts in adapters
disable_error_code = ["misc", "override", "no-any-return"]

[[tool.mypy.overrides]]
module = ["arriadne.integrations.langgraph", "arriadne.integrations.openai_agents"]
# Import-guarded adapter modules: the wrapped SDK decorators/types only exist
# when the optional extra is installed, so strictness degrades there.
disable_error_code = ["misc", "valid-type", "unused-ignore", "untyped-decorator", "no-any-return"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# The ignored rules cover deliberate patterns in this codebase, documented so
# the gate stays meaningful: everything else ruff flags is still an error.
ignore = [
    # Fail-open contract: CLI handlers, hook adapters, and rollback paths
    # catch broad `Exception`, log it, and never break the host session.
    "BLE001",
    # Best-effort cleanup (FAISS index removal, close()) may silently no-op.
    "S110",
    # Dunder annotation style: simple `type | None` on __exit__ args and
    # returning the concrete class from __enter__.
    "PYI036",
    "PYI034",
    # Backup/restore filenames intentionally use local-naive timestamps.
    "DTZ005",
    # Config/API validation prefers ValueError over TypeError for coercions.
    "TRY004",
    # Read-only class-level templates and test stubs flagged as "mutable".
    "RUF012",
    # Slice-vs-next micro-style.
    "RUF015",
    # Reserved typing helper for future embedder work.
    "PYI046",
    # The SPA shell is served from a sync route handler; blocking reads are
    # fine there (uvicorn runs it in the event loop but it is startup-static).
    "ASYNC230",
]
